# Restore-only caching pattern: PRs (and pushes to fork default branches) read existing
# caches but never write back. Only runs on the upstream repo's default branch refresh
# them. This keeps untrusted runs from polluting or evicting trusted cache entries.
# Jobs can also opt into restore-only on the default branch with `cache-save: false`.
#
# See: https://github.com/actions/setup-go/blob/main/docs/advanced-usage.md#restore-only-caches
# and: https://github.com/actions/cache/tree/main/restore#only-restore-cache
name: "Setup go & go-make"
description: "Setup go & go-make"
inputs:
  go-version:
    description: "Go version to install"
    # pinned: must be bumped together with golangci-lint in .binny.yaml
    default: 1.27.3
  go-version-file:
    description: "Go version file to use"
    default: go.mod
  cache-dependency-path:
    description: "Setup Go cache dependency path"
    default: |
      go.sum
      .make/go.sum
  cache-key-prefix:
    description: "Prefix all cache keys with this value"
    default: "v1"
  mod-cache-key-prefix:
    description: "Prefix the go mod cache key with this value. It is separate from cache-key-prefix so every job on an OS/arch shares one mod cache whatever its build cache prefix (a snapshot build, race builds): modules are the same for all of them. Bumping cache-key-prefix does not reset the mod cache; bump this instead."
    default: "v1"
  cache-enabled:
    description: "Enable build/mod and tool caching. When disabled, no restore or save."
    default: "true"
  cache-save:
    description: "Save the go mod, go build, and tool caches on the default branch. When false, caches are restore-only. Use on jobs whose caches shouldn't be the ones persisted (jobs share keys and the first to finish wins). No effect when cache-enabled is false."
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ hashFiles('.git/') == '' }}
      with:
        persist-credentials: false

    # the ubuntu and macOS runner images still trust the leaked eMudhra intermediates
    # (actions/runner-images#15018). Go 1.27.3 already distrusts them in crypto/x509, but curl, git,
    # pip etc use the system store. Probe first so the log shows whether this image is affected, and
    # only on linux pull the fixed ca-certificates and fail if the chains are still trusted. macOS
    # has no package fix so it is report-only. Drop this step once the images ship the fix.
    - name: Updating CA certificates
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        # prints the test hosts whose leaked chain this runner trusts. curl exits 0 when it trusts the
        # chain and 60 when it rejects it; anything else (dns, timeout, site down) is inconclusive
        # and is never treated as trusted.
        trusted() {
          for h in dv-g3b-emudhra dv-g3b-aaa-emudhra; do
            rc=0
            curl -sS -o /dev/null --max-time 10 "https://$h.we-have-a-problem.com/" 2>/dev/null || rc=$?
            case $rc in
              0) echo "$h" ;;
              60) ;;
              *) echo "[$1] $h: inconclusive (curl exit $rc)" >&2 ;;
            esac
          done
        }

        before=$(trusted ca-precheck)
        if [ -z "$before" ]; then
          echo "[ca-precheck] runner rejects the leaked eMudhra chains, nothing to do"
          exit 0
        fi
        echo "[ca-precheck] runner TRUSTS leaked eMudhra chain(s): $(echo $before)"

        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "[ca-precheck] no package fix on $RUNNER_OS, continuing (report only)"
          exit 0
        fi
        if ! command -v apt-get >/dev/null || ! sudo -n true 2>/dev/null; then
          echo "::warning title=eMudhra CA::runner trusts leaked eMudhra chain(s) and has no apt/sudo to fix it: $(echo $before)"
          exit 0
        fi

        echo "[ca-fix] upgrading ca-certificates"
        # a broken third party apt source shouldn't stop the upgrade; the verify below is the gate
        sudo apt-get update -qq || true
        sudo apt-get install -y -qq --only-upgrade ca-certificates
        dpkg-query -W ca-certificates

        after=$(trusted ca-verify)
        if [ -n "$after" ]; then
          echo "::error title=eMudhra CA::runner still trusts leaked eMudhra chain(s) after upgrading ca-certificates: $(echo $after)"
          exit 1
        fi
        echo "[ca-verify] runner now rejects the leaked eMudhra chains"

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: ${{ inputs.go-version != '' || inputs.go-version-file != '' }}
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ !inputs.go-version && inputs.go-version-file || '' }}
        # we manage the go build/mod cache below so we can restore-only (see header)
        cache: false
        check-latest: true

    # capture go cache paths and version for the cache actions below
    - name: Resolve go cache paths
      if: ${{ inputs.cache-enabled == 'true' }}
      shell: bash
      run: |
        echo "GO_MOD_CACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
        echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
        echo "GO_CACHE_GOVERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"

    # go mod cache: restore-only when not saving (see header)
    - name: Restore go mod cache
      if: ${{ inputs.cache-enabled == 'true' && (inputs.cache-save != 'true' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || github.event.repository.fork == true) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.GO_MOD_CACHE }}
        key: ${{ inputs.mod-cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-go-mod-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          ${{ inputs.mod-cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-go-mod-

    # go mod cache: restore + save when saving. No restore-keys here on purpose: go never trims
    # the module cache, so seeding a new key from the previous one carries every stale module
    # version forward and the saved cache only ever grows. Starting cold once per go.sum change
    # keeps it to the modules the current go.sum needs.
    - name: Restore and save go mod cache
      id: go-mod-cache-rw
      if: ${{ inputs.cache-enabled == 'true' && inputs.cache-save == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.fork == false }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.GO_MOD_CACHE }}
        key: ${{ inputs.mod-cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-go-mod-${{ hashFiles(inputs.cache-dependency-path) }}

    # every job on an OS/arch shares one mod cache key and any of them may save it: the first to
    # finish after a go.sum change, or whichever job runs next after the entry is evicted. Keys are
    # immutable, so a job that needed only a few modules would otherwise pin a thin cache that
    # every other job restores, downloads around, and can't replace until go.sum changes again.
    # Downloading everything first makes the saved cache whole whichever job saves it. This only
    # runs on a miss on the default branch, so roughly once per go.sum change and never on PRs.
    - name: Download all go modules
      if: ${{ steps.go-mod-cache-rw.outcome == 'success' && steps.go-mod-cache-rw.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        if [ -f go.mod ]; then go mod download; fi
        if [ -f .make/go.mod ]; then (cd .make && go mod download); fi

    # go build cache: restore-only when not saving (see header). Keyed on the go version since a
    # build cache from another toolchain is useless.
    - name: Restore go build cache
      if: ${{ inputs.cache-enabled == 'true' && (inputs.cache-save != 'true' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || github.event.repository.fork == true) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.GO_BUILD_CACHE }}
        key: ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-go-build-${{ env.GO_CACHE_GOVERSION }}-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-go-build-${{ env.GO_CACHE_GOVERSION }}-

    # go build cache: restore + save when saving. Unlike the mod cache, restore-keys are safe here
    # since go trims build cache entries unused for ~5 days, so chaining keys stays bounded. Keys are
    # immutable, so the saved cache is from whichever job saves first after a go.sum or go version
    # change, and it isn't refreshed until the next one.
    - name: Restore and save go build cache
      if: ${{ inputs.cache-enabled == 'true' && inputs.cache-save == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.fork == false }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.GO_BUILD_CACHE }}
        key: ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-go-build-${{ env.GO_CACHE_GOVERSION }}-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-go-build-${{ env.GO_CACHE_GOVERSION }}-

    # tool cache: restore-only when not saving (see header)
    - name: Restore tool cache
      id: tool-cache
      if: ${{ inputs.cache-enabled == 'true' && (inputs.cache-save != 'true' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || github.event.repository.fork == true) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.tool
        key: ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-tool-${{ hashFiles('.binny.yaml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-tool

    # tool cache: restore + save when saving. restore-keys are fine here: binny installs each tool to
    # .tool/<name> and overwrites it on update, so the dir stays bounded by the number of tools.
    - name: Restore and save tool cache
      id: tool-cache-rw
      if: ${{ inputs.cache-enabled == 'true' && inputs.cache-save == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.fork == false }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.tool
        key: ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-tool-${{ hashFiles('.binny.yaml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ runner.os }}-tool
